<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知识库管理 - 叙思织绣</title>
  <meta name="description" content="叙思织绣知识库管理后台：导入、编辑、生成标签与重建索引。">
  <link rel="stylesheet" href="./assets/style.css">
  <style>
    :root {
      --sidebar-width: 280px;
      --editor-width: 420px;
    }

    .kb-manager-page {
      display: flex;
      min-height: 100vh;
      padding-top: 70px;
      background: var(--color-bg, #0C0C0C);
    }

    /* 顶部导航 */
    .admin-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: rgba(12, 12, 12, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--color-border, rgba(184, 145, 106, 0.2));
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      z-index: 100;
    }

    .admin-header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--color-text, #F5F0E8);
      font-weight: 600;
      font-size: 1.1rem;
    }

    .admin-header-brand img {
      height: 32px;
      width: auto;
    }

    .admin-header-nav {
      display: flex;
      gap: 8px;
    }

    .admin-header-nav a {
      color: var(--color-text-muted, #A89F91);
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 4px;
      transition: all 0.3s;
      font-size: 0.9rem;
    }

    .admin-header-nav a:hover {
      color: var(--color-primary-light, #D4B896);
      background: rgba(184, 145, 106, 0.08);
    }

    /* 左侧边栏 */
    .kb-sidebar {
      width: var(--sidebar-width);
      background: var(--color-bg-light, #141414);
      border-right: 1px solid var(--color-border, rgba(184, 145, 106, 0.2));
      padding: 24px;
      position: fixed;
      top: 70px;
      bottom: 0;
      left: 0;
      overflow-y: auto;
      z-index: 90;
    }

    .sidebar-section {
      margin-bottom: 28px;
    }

    .sidebar-section h3 {
      font-size: 0.85rem;
      color: var(--color-text-muted, #A89F91);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .import-zone {
      border: 2px dashed var(--color-border, rgba(184, 145, 106, 0.3));
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      color: var(--color-text-muted, #A89F91);
      cursor: pointer;
      transition: all 0.3s;
    }

    .import-zone:hover,
    .import-zone.dragover {
      border-color: var(--color-primary, #B8916A);
      background: rgba(184, 145, 106, 0.05);
    }

    .import-zone input {
      display: none;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--color-text-muted, #A89F91);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      background: var(--color-bg-card, #1A1A1A);
      border: 1px solid var(--color-border, rgba(184, 145, 106, 0.2));
      border-radius: 4px;
      color: var(--color-text, #F5F0E8);
      font-size: 0.9rem;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--color-primary, #B8916A);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 18px;
      border-radius: 4px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      border: none;
    }

    .btn-primary {
      background: var(--color-primary, #B8916A);
      color: #0C0C0C;
    }

    .btn-primary:hover {
      background: var(--color-primary-light, #D4B896);
    }

    .btn-secondary {
      background: transparent;
      color: var(--color-text, #F5F0E8);
      border: 1px solid var(--color-border, rgba(184, 145, 106, 0.3));
    }

    .btn-secondary:hover {
      border-color: var(--color-primary, #B8916A);
      color: var(--color-primary-light, #D4B896);
    }

    .btn-danger {
      background: rgba(180, 80, 80, 0.2);
      color: #d48484;
      border: 1px solid rgba(180, 80, 80, 0.4);
    }

    .btn-danger:hover {
      background: rgba(180, 80, 80, 0.3);
    }

    .btn-block {
      width: 100%;
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 0.8rem;
    }

    /* 主内容区 */
    .kb-main {
      flex: 1;
      margin-left: var(--sidebar-width);
      padding: 24px 32px;
      min-width: 0;
    }

    .kb-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .kb-toolbar h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .kb-toolbar-actions {
      display: flex;
      gap: 8px;
    }

    .view-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--color-border, rgba(184, 145, 106, 0.2));
    }

    .view-tab {
      padding: 10px 20px;
      color: var(--color-text-muted, #A89F91);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.3s;
    }

    .view-tab:hover,
    .view-tab.active {
      color: var(--color-primary-light, #D4B896);
      border-bottom-color: var(--color-primary, #B8916A);
    }

    /* 列表 */
    .kb-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }

    .kb-card {
      background: var(--color-bg-card, #1A1A1A);
      border: 1px solid var(--color-border, rgba(184, 145, 106, 0.15));
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s;
    }

    .kb-card:hover {
      transform: translateY(-4px);
      border-color: var(--color-primary, #B8916A);
    }

    .kb-card-image {
      aspect-ratio: 4/3;
      background: var(--color-bg-light, #141414);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .kb-card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .kb-card-image.empty {
      color: var(--color-text-muted, #A89F91);
      font-size: 0.85rem;
    }

    .kb-card-body {
      padding: 14px;
    }

    .kb-card-title {
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .kb-card-meta {
      font-size: 0.8rem;
      color: var(--color-text-muted, #A89F91);
      margin-bottom: 8px;
    }

    .kb-card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .kb-card-tag {
      font-size: 0.7rem;
      padding: 2px 8px;
      background: rgba(184, 145, 106, 0.12);
      color: var(--color-primary-light, #D4B896);
      border-radius: 12px;
    }

    .kb-card-warning {
      margin-top: 8px;
      padding: 6px 10px;
      background: rgba(200, 160, 80, 0.12);
      border-radius: 4px;
      font-size: 0.75rem;
      color: #c8a050;
    }

    .kb-empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--color-text-muted, #A89F91);
    }

    /* 编辑器弹窗 */
    .editor-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: flex-end;
      z-index: 200;
    }

    .editor-overlay.active {
      display: flex;
    }

    .editor-panel {
      width: var(--editor-width);
      max-width: 100%;
      height: 100%;
      background: var(--color-bg-light, #141414);
      border-left: 1px solid var(--color-border, rgba(184, 145, 106, 0.2));
      overflow-y: auto;
      padding: 24px;
      transform: translateX(100%);
      transition: transform 0.3s ease;
    }

    .editor-overlay.active .editor-panel {
      transform: translateX(0);
    }

    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .editor-header h2 {
      font-size: 1.2rem;
    }

    .editor-close {
      background: none;
      border: none;
      color: var(--color-text-muted, #A89F91);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .editor-section {
      margin-bottom: 24px;
    }

    .editor-section h3 {
      font-size: 0.85rem;
      color: var(--color-text-muted, #A89F91);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .editor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form-control-full {
      grid-column: 1 / -1;
    }

    textarea.form-control {
      min-height: 100px;
      resize: vertical;
    }

    .tag-input-area {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px;
      background: var(--color-bg-card, #1A1A1A);
      border: 1px solid var(--color-border, rgba(184, 145, 106, 0.2));
      border-radius: 4px;
      min-height: 42px;
    }

    .tag-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      background: rgba(184, 145, 106, 0.15);
      color: var(--color-primary-light, #D4B896);
      border-radius: 14px;
      font-size: 0.8rem;
    }

    .tag-chip button {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      font-size: 0.9rem;
      line-height: 1;
    }

    .tag-input {
      flex: 1;
      min-width: 80px;
      background: transparent;
      border: none;
      color: var(--color-text, #F5F0E8);
      outline: none;
      font-size: 0.9rem;
    }

    .image-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .image-item {
      display: flex;
      gap: 10px;
      padding: 10px;
      background: var(--color-bg-card, #1A1A1A);
      border: 1px solid var(--color-border, rgba(184, 145, 106, 0.15));
      border-radius: 6px;
      align-items: center;
    }

    .image-item img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 4px;
    }

    .image-item-info {
      flex: 1;
      min-width: 0;
    }

    .image-item-info input {
      width: 100%;
      margin-bottom: 6px;
    }

    .image-item-actions {
      display: flex;
      gap: 6px;
    }

    .upload-image-btn {
      border: 2px dashed var(--color-border, rgba(184, 145, 106, 0.3));
      border-radius: 6px;
      padding: 16px;
      text-align: center;
      color: var(--color-text-muted, #A89F91);
      cursor: pointer;
      transition: all 0.3s;
    }

    .upload-image-btn:hover {
      border-color: var(--color-primary, #B8916A);
      color: var(--color-primary-light, #D4B896);
    }

    .editor-footer {
      position: sticky;
      bottom: 0;
      background: var(--color-bg-light, #141414);
      padding: 16px 0;
      border-top: 1px solid var(--color-border, rgba(184, 145, 106, 0.2));
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .status-bar {
      position: fixed;
      bottom: 20px;
      left: calc(var(--sidebar-width) + 32px);
      right: 32px;
      padding: 12px 20px;
      background: var(--color-bg-card, #1A1A1A);
      border: 1px solid var(--color-border, rgba(184, 145, 106, 0.2));
      border-radius: 6px;
      display: none;
      align-items: center;
      gap: 10px;
      z-index: 150;
    }

    .status-bar.active {
      display: flex;
    }

    .status-bar.success {
      border-color: rgba(100, 160, 100, 0.4);
      color: #8fc08f;
    }

    .status-bar.error {
      border-color: rgba(180, 80, 80, 0.4);
      color: #d48484;
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(12, 12, 12, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 300;
    }

    .loading-overlay.active {
      display: flex;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--color-border, rgba(184, 145, 106, 0.2));
      border-top-color: var(--color-primary, #B8916A);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 500;
    }

    .badge-published {
      background: rgba(100, 160, 100, 0.15);
      color: #8fc08f;
    }

    .badge-draft {
      background: rgba(180, 160, 100, 0.15);
      color: #c8a050;
    }

    .badge-archived {
      background: rgba(140, 140, 140, 0.15);
      color: #a0a0a0;
    }

    @media (max-width: 1024px) {
      .kb-sidebar {
        width: 100%;
        position: relative;
        top: 0;
        border-right: none;
        border-bottom: 1px solid var(--color-border, rgba(184, 145, 106, 0.2));
      }
      .kb-main {
        margin-left: 0;
      }
      .kb-manager-page {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <header class="admin-header">
    <div class="admin-header-brand">
      <img src="./assets/images/xusi/logo_0.jpg" alt="叙思织绣">
      <span>知识库管理</span>
    </div>
    <nav class="admin-header-nav">
      <a href="./index.html">首页</a>
      <a href="./search.html">检索页</a>
      <a href="./analytics.html">数据分析</a>
    </nav>
  </header>

  <div class="kb-manager-page">
    <!-- 左侧边栏 -->
    <aside class="kb-sidebar">
      <div class="sidebar-section">
        <h3>导入</h3>
        <div class="import-zone" id="importZone">
          <input type="file" id="folderInput" webkitdirectory directory multiple>
          <p>📁 点击选择文件夹</p>
          <p style="font-size: 0.8rem; margin-top: 8px;">或拖拽文件夹到此处</p>
          <p style="font-size: 0.75rem; margin-top: 8px; opacity: 0.7;">支持 .md 笔记与图片文件</p>
        </div>
      </div>

      <div class="sidebar-section">
        <h3>筛选藏品</h3>
        <div class="form-group">
          <label>关键词</label>
          <input type="text" class="form-control" id="filterKeyword" placeholder="名称 / ID / 标签">
        </div>
        <div class="form-group">
          <label>来源</label>
          <select class="form-control" id="filterSource">
            <option value="">全部来源</option>
          </select>
        </div>
        <div class="form-group">
          <label>分类</label>
          <select class="form-control" id="filterCategory">
            <option value="">全部分类</option>
          </select>
        </div>
        <div class="form-group">
          <label>状态</label>
          <select class="form-control" id="filterStatus">
            <option value="">全部状态</option>
            <option value="published">已发布</option>
            <option value="draft">草稿</option>
            <option value="archived">已归档</option>
          </select>
        </div>
        <button class="btn btn-secondary btn-block btn-sm" id="btnApplyFilter">应用筛选</button>
      </div>

      <div class="sidebar-section">
        <h3>操作</h3>
        <button class="btn btn-primary btn-block" id="btnRebuildKb">🔄 重建数据库</button>
        <button class="btn btn-secondary btn-block" id="btnRebuildVectors" style="margin-top: 8px;">🔍 重建向量索引</button>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="kb-main">
      <div class="kb-toolbar">
        <h1 id="pageTitle">导入预览</h1>
        <div class="kb-toolbar-actions">
          <button class="btn btn-primary" id="btnSaveDrafts" style="display: none;">💾 保存选中草稿</button>
          <button class="btn btn-secondary" id="btnRefresh">刷新</button>
        </div>
      </div>

      <div class="view-tabs">
        <div class="view-tab active" data-view="drafts">导入草稿</div>
        <div class="view-tab" data-view="collections">已入库藏品</div>
      </div>

      <div id="contentArea">
        <div class="kb-empty">请选择文件夹开始导入</div>
      </div>

      <div class="pagination" id="pagination" style="display: none; margin-top: 20px;">
        <button class="btn btn-secondary btn-sm" id="btnPrev">上一页</button>
        <span id="pageInfo" style="color: var(--color-text-muted); padding: 0 12px;"></span>
        <button class="btn btn-secondary btn-sm" id="btnNext">下一页</button>
      </div>
    </main>
  </div>

  <!-- 编辑器弹窗 -->
  <div class="editor-overlay" id="editorOverlay">
    <div class="editor-panel">
      <div class="editor-header">
        <h2 id="editorTitle">编辑藏品</h2>
        <button class="editor-close" id="editorClose">×</button>
      </div>
      <div id="editorForm"></div>
      <div class="editor-footer">
        <button class="btn btn-danger" id="btnArchive">归档</button>
        <div style="flex: 1;"></div>
        <button class="btn btn-secondary" id="btnGenerateTags">✨ 生成标签</button>
        <button class="btn btn-primary" id="btnSave">保存</button>
      </div>
    </div>
  </div>

  <!-- 状态栏 -->
  <div class="status-bar" id="statusBar"></div>

  <!-- 加载动画 -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
  </div>

  <script src="./assets/config.js?v=2"></script>
  <script src="./assets/kb-manager.js?v=2"></script>
</body>
</html>
